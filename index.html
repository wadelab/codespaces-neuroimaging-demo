<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eurasian Otter Observations</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoCcTzABF2Q9S8aXf--6oU+EVQ/azjD7aYNkUoQ="
          crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/4K9+sSENG+oFGADcXQA4="
            crossorigin=""></script>
    <style>
        html, body {
            height: 100%;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #eef2f5;
        }
        header {
            padding: 16px 12px 6px;
            text-align: center;
            background: #fff;
            border-bottom: 1px solid #ddd;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #1e2a38;
        }
        #map {
            flex: 1;
            min-height: 420px;
            width: 100%;
            height: 100%;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: #fff;
            border-top: 1px solid #ddd;
        }
        button {
            appearance: none;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            background: #007bff;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 1.25rem;
            }
            #map {
                min-height: 320px;
            }
            button {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Eurasian Otter Observations</h1>
    </header>
    <div id="map"></div>
    <div class="controls">
        <button id="refreshBtn">Refresh Observations</button>
        <button id="clearBtn">Clear Markers</button>
    </div>
    <script>
        const map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        }).addTo(map);

        // Ensure Leaflet redraws once the page layout is stable
        setTimeout(() => map.invalidateSize(), 0);

        const markerGroup = L.layerGroup().addTo(map);

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function parseCoordinates(obs) {
            if (typeof obs.latitude === 'number' && typeof obs.longitude === 'number') {
                return [obs.latitude, obs.longitude];
            }
            if (!obs.location) {
                return null;
            }
            const [lat, lng] = obs.location.split(',').map(Number);
            return Number.isFinite(lat) && Number.isFinite(lng) ? [lat, lng] : null;
        }

        function fetchObservations() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.disabled = true;

            fetch('https://api.inaturalist.org/v1/observations?taxon_name=Lutra%20lutra&per_page=200&order=desc&order_by=observed_on')
                .then(response => response.json())
                .then(data => {
                    clearMarkers();
                    const bounds = [];

                    data.results.forEach(obs => {
                        const coords = parseCoordinates(obs);
                        if (!coords) {
                            return;
                        }

                        const [lat, lng] = coords;
                        const commonName = obs.taxon ? obs.taxon.preferred_common_name || obs.taxon.name : 'Unknown';
                        const sciName = obs.taxon ? obs.taxon.name : 'Unknown';
                        const date = obs.observed_on || 'Unknown';
                        const user = obs.user ? obs.user.login : 'Unknown';
                        const link = `https://www.inaturalist.org/observations/${encodeURIComponent(obs.id)}`;

                        const popupContent = `
                            <strong>${escapeHtml(commonName)} (${escapeHtml(sciName)})</strong><br>
                            Date: ${escapeHtml(date)}<br>
                            Observer: ${escapeHtml(user)}<br>
                            <a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">View on iNaturalist</a>
                        `;

                        L.marker([lat, lng]).bindPopup(popupContent).addTo(markerGroup);
                        bounds.push([lat, lng]);
                    });

                    if (bounds.length > 0) {
                        map.fitBounds(bounds, { padding: [20, 20], maxZoom: 12 });
                    }
                })
                .catch(error => console.error('Error fetching observations:', error))
                .finally(() => {
                    refreshBtn.disabled = false;
                });
        }

        function clearMarkers() {
            markerGroup.clearLayers();
        }

        document.getElementById('refreshBtn').addEventListener('click', fetchObservations);
        document.getElementById('clearBtn').addEventListener('click', clearMarkers);

        fetchObservations();
    </script>
</body>
</html>
