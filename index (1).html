<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiger Observations</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoCcTzABF2Q9S8aXf--6oU+EVQ/azjD7aYNkUoQ="
     crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/4K9+sSENG+oFGADcXQA4="
     crossorigin=""></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            color: #333;
            padding: 10px;
            margin-bottom: 0;
        }
        #map {
            flex-grow: 1;
            height: 600px; /* Default height */
            width: 100%;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .controls {
            text-align: center;
            padding: 10px;
            background-color: #fff;
            border-top: 1px solid #eee;
        }
        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        .leaflet-popup-content-wrapper .leaflet-popup-content {
            font-size: 14px;
        }
        .leaflet-container {
            background: #fff;
        }
        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
            }
            button {
                width: 90%;
                margin: 5px auto;
            }
            #map {
                height: 400px; /* Adjust height for smaller screens */
            }
        }
    </style>
</head>
<body>
    <h1>Tiger (Panthera tigris) Observations</h1>
    <div class="controls">
        <button id="refreshButton">Refresh Observations</button>
        <button id="clearButton">Clear Markers</button>
    </div>
    <div id="map"></div>

    <script>
        // Initialize the map
        const map = L.map('map').setView([0, 0], 2); // Centered globally with zoom 2

        // Use Esri World Imagery basemap
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
            maxZoom: 18
        }).addTo(map);

        let markers = L.featureGroup().addTo(map);

        const fetchTigerObservations = async () => {
            const taxonId = 41639; // iNaturalist taxon ID for Panthera tigris (Tiger)
            const apiUrl = `https://api.inaturalist.org/v1/observations?taxon_id=${taxonId}&per_page=100&has_geo=true&order=desc&order_by=observed_on`;

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                displayObservations(data.results);
            } catch (error) {
                console.error('Error fetching iNaturalist observations:', error);
                alert('Failed to fetch observations. Please try again later.');
            }
        };

        const displayObservations = (observations) => {
            markers.clearLayers(); // Clear existing markers
            const bounds = [];

            if (observations.length === 0) {
                alert('No observations found.');
                return;
            }

            observations.forEach(obs => {
                if (obs.geojson && obs.geojson.coordinates) {
                    const lat = obs.geojson.coordinates[1];
                    const lon = obs.geojson.coordinates[0];
                    const commonName = obs.common_name ? escapeHtml(obs.common_name) : 'N/A';
                    const scientificName = obs.species_guess ? escapeHtml(obs.species_guess) : 'N/A';
                    const observedOn = obs.time_observed_at ? new Date(obs.time_observed_at).toLocaleString() : 'N/A';
                    const observerUsername = obs.user ? escapeHtml(obs.user.login) : 'Anonymous';
                    const inaturalistUrl = obs.uri ? obs.uri : '#';

                    const popupContent = `
                        <b>${commonName}</b> (${scientificName})<br>
                        Observed: ${observedOn}<br>
                        Observer: <a href="https://www.inaturalist.org/users/${observerUsername}" target="_blank">${observerUsername}</a><br>
                        <a href="${inaturalistUrl}" target="_blank">View on iNaturalist</a>
                    `;

                    const marker = L.marker([lat, lon]).bindPopup(popupContent);
                    markers.addLayer(marker);
                    bounds.push([lat, lon]);
                } else {
                    console.log('Observation without valid geojson coordinates:', obs);
                }
            });

            if (bounds.length > 0) {
                // Fit map to markers with padding, cap max zoom at 10 to avoid over-zooming
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 10 });
            }
        };

        // Function to safely escape HTML for popup content
        const escapeHtml = (str) => {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(str));
            return div.innerHTML;
        };

        document.getElementById('refreshButton').addEventListener('click', fetchTigerObservations);
        document.getElementById('clearButton').addEventListener('click', () => {
            markers.clearLayers();
            alert('All markers cleared.');
        });

        // Automatically fetch and display observations on page load
        document.addEventListener('DOMContentLoaded', fetchTigerObservations);
    </script>
</body>
</html>
